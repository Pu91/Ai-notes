<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Notes</title>
    <style>
        html, body { height: 100dvh; margin: 0; padding: 0; background-color: #ffffff; color: #333; font-family: -apple-system, sans-serif; overflow: hidden; }
        #main-area { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        #header { flex: 0 0 60px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: bold; font-size: 18px; background: #fff; z-index: 10;}
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #333; padding: 0; margin-right: 15px; }
        .new-chat-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #333; padding: 5px; }
        
        #sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background-color: #f9f9f9; border-right: 1px solid #e5e5e5; transition: left 0.3s ease; z-index: 100; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .close-sidebar { align-self: flex-end; background: none; border: none; font-size: 28px; cursor: pointer; color: #666; margin-bottom: 20px;}
        .sidebar-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 8px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;}
        .sidebar-item:hover { background: #e5e5e5; }
        .active-session { background: #e5e5e5; font-weight: bold; }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
        #overlay.open { display: block; }
        
        #chat-box { flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth;}
        .message-row { display: flex; gap: 12px; margin-bottom: 25px; width: 100%; }
        .user-row { flex-direction: row-reverse; }
        .bot-row { flex-direction: row; }
        
        .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f0f0;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word;}
        .user-msg { background-color: #f3f3f3; border-top-right-radius: 4px; }
        .bot-msg { background-color: transparent; padding: 10px 0; }
        
        #input-container { flex: 0 0 auto; padding: 15px; background: #fff; }
        #form-wrapper { width: 100%; max-width: 800px; margin: 0 auto; background: #f4f4f4; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; box-sizing: border-box; }
        #prompt { flex-grow: 1; border: none; outline: none; background: transparent; padding: 10px; font-size: 16px; resize: none; max-height: 100px; height: 24px; }
        .send-btn { background: #000; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;}
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-spinner { border: 2px solid transparent; border-top: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; }
        
        #typing-indicator { display: none; align-items: center; gap: 8px; font-size: 13px; color: #666; margin-left: 55px; margin-bottom: 10px; font-style: italic; }
        .typing-spinner { border: 2px solid #ccc; border-top-color: #000; border-radius: 50%; width: 12px; height: 12px; animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div id="overlay" onclick="toggleSidebar()"></div>
    
    <div id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">×</button>
        <div class="sidebar-item" onclick="window.location.href='/'">➕ New Chat</div>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <div style="font-size: 12px; color: #888; font-weight: bold; padding-left: 10px; margin-bottom: 10px;">Chat History</div>
        
        <div style="flex: 1; overflow-y: auto;">
            {% for s in sidebar_sessions %}
                <div class="sidebar-item {% if s.id == current_session %}active-session{% endif %}" onclick="window.location.href='/?session_id={{ s.id }}'">
                    💬 {{ s.title }}
                </div>
            {% endfor %}
        </div>

        <div style="margin-top: auto; padding-top: 10px;">
            <a href="/logout" style="text-decoration: none; color: #d93025;"><div class="sidebar-item">🚪 Logout</div></a>
            <div class="sidebar-item" style="background: linear-gradient(90deg, #ff8a00, #e52e71); color: white; text-align: center; font-weight: bold; box-shadow: 0 4px 10px rgba(229,46,113,0.3);">⭐ Upgrade to Plus</div>
        </div>
    </div>

    <div id="main-area">
        <div id="header">
            <div style="display: flex; align-items: center;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <img src="/static/bot.png" style="width: 24px; height: 24px; border-radius: 5px;" alt="AI"> AI Notes
                </span>
            </div>
            <button class="new-chat-btn" onclick="window.location.href='/'">➕</button>
        </div>

        <div id="chat-box">
            {% if history %}
                {% for chat in history %}
                    <div class="message-row user-row">
                        <div class="avatar"><img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&rounded=true"></div>
                        <div class="message user-msg">{{ chat.user_msg }}</div>
                    </div>
                    <div class="message-row bot-row">
                        <div class="avatar"><img src="/static/bot.png" style="border-radius: 5px;"></div>
                        <div class="message bot-msg">{{ chat.ai_msg | replace('\n', '<br>') | safe }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        
        <div id="typing-indicator">
            <div class="typing-spinner"></div>
            AI is analyzing your notes...
        </div>

        <div id="input-container">
            <div id="form-wrapper">
                <textarea id="prompt" placeholder="Message AI Notes..."></textarea>
                <button class="send-btn" id="send-btn" type="button" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
        let currentSessionId = "{{ current_session }}"; 

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function appendMessage(sender, text, isError = false) {
            const rowDiv = document.createElement('div');
            rowDiv.className = sender === 'user' ? 'message-row user-row' : 'message-row bot-row';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            const img = document.createElement('img');
            img.src = sender === 'user' ? 'https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&rounded=true' : '/static/bot.png';
            if(sender === 'bot') img.style.borderRadius = '5px';
            avatarDiv.appendChild(img);

            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'message user-msg' : 'message bot-msg';
            if(isError) msgDiv.style.color = "red";
            
            if (sender === 'bot' && !isError) {
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                msgDiv.innerText = text;
            }

            rowDiv.appendChild(avatarDiv);
            rowDiv.appendChild(msgDiv);
            chatBox.appendChild(rowDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const promptInput = document.getElementById('prompt');
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing-indicator');
            
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            promptInput.value = '';

            sendBtn.innerHTML = '<div class="btn-spinner"></div>';
            sendBtn.disabled = true;
            typingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('session_id', currentSessionId);

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const data = await response.json();
                
                sendBtn.innerHTML = '↑';
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                
                if(data.error) {
                    appendMessage('bot', "Error: " + data.error, true);
                } else {
                    appendMessage('bot', data.response);
                    
                    if (currentSessionId === "None" || !currentSessionId) {
                        currentSessionId = data.session_id;
                        window.history.pushState(null, '', '/?session_id=' + data.session_id);
                        setTimeout(() => location.reload(), 3000); 
                    }
                }
            } catch (err) {
                sendBtn.innerHTML = '↑';
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                appendMessage('bot', "System Error. Please try again.", true);
            }
        }

        document.getElementById('prompt').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>

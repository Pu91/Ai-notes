<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Notes</title>
    <style>
        html, body { height: 100dvh; margin: 0; padding: 0; background-color: #ffffff; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        #main-area { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        
        /* Header */
        #header { flex: 0 0 60px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: bold; font-size: 18px; background: #fff; z-index: 10;}
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #333; padding: 0; margin-right: 15px; }
        .new-chat-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #333; padding: 5px; }
        
        /* Sidebar */
        #sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background-color: #f9f9f9; border-right: 1px solid #e5e5e5; transition: left 0.3s ease; z-index: 100; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .close-sidebar { align-self: flex-end; background: none; border: none; font-size: 28px; cursor: pointer; color: #666; margin-bottom: 20px;}
        .sidebar-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 8px; font-weight: 500; }
        .sidebar-item:hover { background: #e5e5e5; }
        
        /* Overlay for mobile */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
        #overlay.open { display: block; }
        
        /* Chat Box */
        #chat-box { flex: 1 1 auto; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth;}
        
        .message-row { display: flex; gap: 12px; margin-bottom: 25px; width: 100%; }
        .user-row { flex-direction: row-reverse; }
        .bot-row { flex-direction: row; }
        
        /* Profile Images */
        .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f0f0;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word;}
        .user-msg { background-color: #f3f3f3; border-top-right-radius: 4px; }
        .bot-msg { background-color: transparent; padding: 10px 0; }
        
        /* Input Area */
        #input-container { flex: 0 0 auto; padding: 15px; background: #fff; }
        #form-wrapper { width: 100%; max-width: 800px; margin: 0 auto; background: #f4f4f4; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; box-sizing: border-box; }
        .attach-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px 10px; color: #666; }
        #prompt { flex-grow: 1; border: none; outline: none; background: transparent; padding: 10px; font-size: 16px; resize: none; max-height: 100px; height: 24px; }
        .send-btn { background: #000; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;}
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #file-name-label { font-size: 12px; color: #28a745; margin-left: 10px; display: none; margin-bottom: 5px; text-align: center;}
    </style>
</head>
<body>
    <!-- Sidebar & Overlay -->
    <div id="overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">×</button>
        <div class="sidebar-item" onclick="location.reload()">➕ New Chat</div>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <div style="font-size: 12px; color: #888; font-weight: bold; padding-left: 10px; margin-bottom: 10px;">Chat History</div>
        <div class="sidebar-item">📝 Ai Notes Concept</div>
    </div>

    <div id="main-area">
        <div id="header">
            <div style="display: flex; align-items: center;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <img src="/static/bot.png" style="width: 24px; height: 24px; border-radius: 5px;" alt="AI"> AI Notes
                </span>
            </div>
            <button class="new-chat-btn" onclick="location.reload()">➕</button>
        </div>

        <div id="chat-box">
            <!-- Messages will appear here -->
        </div>

        <div id="input-container">
            <div id="file-name-label"></div>
            <div id="form-wrapper">
                <input type="file" id="pdf_file" accept=".pdf" style="display: none;" onchange="showFileName()">
                <button class="attach-btn" onclick="document.getElementById('pdf_file').click()">📎</button>
                <textarea id="prompt" placeholder="Message AI Notes..."></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
                <div class="loader" id="loader"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function showFileName() {
            const file = document.getElementById('pdf_file').files[0];
            const label = document.getElementById('file-name-label');
            if(file) {
                label.innerText = file.name + " (Attached)";
                label.style.display = "block";
            }
        }

        function appendMessage(sender, text, isError = false) {
            const chatBox = document.getElementById('chat-box');
            const rowDiv = document.createElement('div');
            rowDiv.className = sender === 'user' ? 'message-row user-row' : 'message-row bot-row';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            
            // Image URLs for Bot and User
            const botImgUrl = '/static/bot.png'; 
            const userImgUrl = 'https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&rounded=true'; // Default User Profile Photo

            const img = document.createElement('img');
            img.src = sender === 'user' ? userImgUrl : botImgUrl;
            avatarDiv.appendChild(img);

            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' ? 'message user-msg' : 'message bot-msg';
            if(isError) msgDiv.style.color = "red";
            
            if (sender === 'bot' && !isError) {
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                msgDiv.innerText = text;
            }

            rowDiv.appendChild(avatarDiv);
            rowDiv.appendChild(msgDiv);
            chatBox.appendChild(rowDiv);
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const promptInput = document.getElementById('prompt');
            const fileInput = document.getElementById('pdf_file');
            const sendBtn = document.getElementById('send-btn');
            const loader = document.getElementById('loader');
            
            const prompt = promptInput.value.trim();
            if (!prompt && !fileInput.files.length) return;

            appendMessage('user', prompt || "[PDF Uploaded]");

            const formData = new FormData();
            formData.append('prompt', prompt);
            if (fileInput.files.length > 0) {
                formData.append('pdf_file', fileInput.files[0]);
            }

            promptInput.value = '';
            fileInput.value = '';
            document.getElementById('file-name-label').style.display = 'none';
            sendBtn.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const data = await response.json();
                
                if(data.error) {
                    appendMessage('bot', "Error: " + data.error, true);
                } else {
                    appendMessage('bot', data.response);
                }
            } catch (err) {
                appendMessage('bot', "System Error. Please try again.", true);
            }

            loader.style.display = 'none';
            sendBtn.style.display = 'flex';
        }

        document.getElementById('prompt').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>

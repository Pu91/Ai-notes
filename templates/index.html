<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Notes</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; height: 100vh; background-color: #ffffff; color: #333; }
        
        /* Sidebar Styling */
        #sidebar { width: 260px; background-color: #f9f9f9; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; padding: 10px; transition: transform 0.3s ease; }
        .new-chat-btn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; font-weight: 500; font-size: 14px; margin-bottom: 20px; }
        .new-chat-btn:hover { background: #f0f0f0; }
        .history-title { font-size: 12px; color: #888; margin-bottom: 10px; font-weight: bold; padding-left: 10px;}
        .history-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #333; margin-bottom: 5px; }
        .history-item:hover { background: #e5e5e5; }
        .upgrade-btn { margin-top: auto; padding: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;}
        .upgrade-btn:hover { background: #e5e5e5; }
        
        /* Main Chat Area */
        #main-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%;}
        
        /* Header */
        #header { height: 60px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 18px; justify-content: space-between;}
        .hamburger { display: none; font-size: 24px; cursor: pointer; background: none; border: none;}
        
        /* Chat Box */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px;}
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px;}
        .user-msg { background-color: #f3f3f3; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-msg { background-color: #fff; align-self: flex-start; border: 1px solid #e5e5e5; }
        
        /* Input Area */
        #input-container { position: absolute; bottom: 0; width: 100%; padding: 20px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 40%); box-sizing: border-box; display: flex; justify-content: center;}
        #form-wrapper { width: 100%; max-width: 800px; background: #fff; border: 1px solid #ccc; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .attach-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px 10px; color: #666; }
        #prompt { flex-grow: 1; border: none; outline: none; padding: 10px; font-size: 16px; resize: none; max-height: 100px; height: 24px;}
        .send-btn { background: #000; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;}
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Loading Animation */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* File Label */
        #file-name-label { font-size: 12px; color: #28a745; margin-left: 10px; display: none;}

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #sidebar { position: absolute; z-index: 100; height: 100%; transform: translateX(-100%); width: 250px;}
            #sidebar.open { transform: translateX(0); }
            .hamburger { display: block; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">➕ New Chat</button>
        <div class="history-title">Chat History</div>
        <div class="history-item">📝 Unit 6 & 7 Notes</div>
        <div class="history-item">📝 Bengali Syllabus</div>
        <div class="upgrade-btn">🚀 Upgrade to Plus</div>
    </div>

    <div id="main-area">
        <div id="header">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <span>🤖 AI Notes</span>
            <span style="width: 24px;"></span> <!-- Balancing spacing -->
        </div>

        <div id="chat-box">
            <!-- Messages will appear here -->
        </div>

        <div id="input-container">
            <div id="form-wrapper">
                <input type="file" id="pdf_file" accept=".pdf" style="display: none;" onchange="showFileName()">
                <button class="attach-btn" onclick="document.getElementById('pdf_file').click()">📎</button>
                <textarea id="prompt" placeholder="আপনার সিলেবাসের টপিক বা প্রশ্ন লিখুন..."></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
                <div class="loader" id="loader"></div>
            </div>
            <div id="file-name-label"></div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showFileName() {
            const file = document.getElementById('pdf_file').files[0];
            const label = document.getElementById('file-name-label');
            if(file) {
                label.innerText = file.name + " (যুক্ত হয়েছে)";
                label.style.display = "block";
            }
        }

        async function sendMessage() {
            const promptInput = document.getElementById('prompt');
            const fileInput = document.getElementById('pdf_file');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');
            const loader = document.getElementById('loader');
            
            const prompt = promptInput.value.trim();
            if (!prompt && !fileInput.files.length) return;

            // Add user message to screen
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = prompt || "[PDF Uploaded]";
            chatBox.appendChild(userDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Prepare form data
            const formData = new FormData();
            formData.append('prompt', prompt);
            if (fileInput.files.length > 0) {
                formData.append('pdf_file', fileInput.files[0]);
            }

            // Reset input UI
            promptInput.value = '';
            fileInput.value = '';
            document.getElementById('file-name-label').style.display = 'none';
            sendBtn.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                if(data.error) {
                    botDiv.innerText = "Error: " + data.error;
                    botDiv.style.color = "red";
                } else {
                    botDiv.innerHTML = data.response.replace(/\n/g, '<br>');
                }
                chatBox.appendChild(botDiv);
            } catch (err) {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-msg';
                botDiv.innerText = "System Error. Please try again.";
                chatBox.appendChild(botDiv);
            }

            loader.style.display = 'none';
            sendBtn.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Allow pressing Enter to send
        document.getElementById('prompt').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>

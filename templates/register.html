<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Notes</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px;}
        .google-btn { background: #fff; color: #333; border: 1px solid #ddd; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: bold; }
        a { color: #0D8ABC; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>alert("{{ messages[0] }}");</script>
      {% endif %}
    {% endwith %}

    <div class="box">
        <h2>Create Account</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Create Password" required>
            <button class="btn" type="submit">Sign Up</button>
        </form>
        
        <div style="margin: 20px 0; color: #888;">OR</div>
        
        <button type="button" class="btn google-btn" id="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20"> Sign Up with Google
        </button>

        <p style="margin-top: 25px;">Already have an account? <a href="/login">Login</a></p>
    </div>

    <!-- Firebase Auth Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // আপনার দেওয়া আসল Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCvOIwR5g--FPddJr4gQ-i4_EjR47iN01s",
            authDomain: "ai-tution-a7e64.firebaseapp.com",
            projectId: "ai-tution-a7e64",
            storageBucket: "ai-tution-a7e64.firebasestorage.app",
            messagingSenderId: "696067351148",
            appId: "1:696067351148:web:3b45e0127b4baf8687ae49",
            measurementId: "G-WXK2NF2P1X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('google-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
            .then((result) => result.user.getIdToken())
            .then((token) => {
                // টোকেনটি সার্ভারে পাঠানো হচ্ছে
                fetch('/google-login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: token})
                }).then(res => res.json()).then(data => {
                    if(data.status === 'success') {
                        window.location.href = '/';
                    } else {
                        alert("Google Sign Up Failed!");
                    }
                });
            })
            .catch((error) => {
                alert("Error: " + error.message);
            });
        });
    </script>
</body>
</html>

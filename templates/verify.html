<form method="POST" style="text-align:center; padding:50px;">
    <h2>Enter OTP & New Password</h2>
    <input type="text" name="otp" placeholder="Enter 4-digit OTP" required style="padding:10px; width:250px;"><br><br>
    <input type="password" name="new_password" placeholder="New Password" required style="padding:10px; width:250px;"><br><br>
    <button type="submit" style="padding:10px; background:#0D8ABC; color:#fff;">Save Password</button>
</form>

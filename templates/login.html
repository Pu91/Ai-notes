<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Notes</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .google-btn { background: #fff; color: #333; border: 1px solid #ddd; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: bold; }
        a { color: #0D8ABC; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <!-- Popup Alert Script -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>alert("{{ messages[0] }}");</script>
      {% endif %}
    {% endwith %}

    <div class="box">
        <h2>Welcome Back</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <div style="text-align: right; margin-bottom: 10px;"><a href="/forgot-password">Forgot Password?</a></div>
            <button class="btn" type="submit">Login</button>
        </form>
        
        <div style="margin: 20px 0; color: #888;">OR</div>
        
        <!-- Google Login Button (UI) -->
        <button class="btn google-btn" onclick="alert('Google Auth requires Cloud API Setup. Coming soon!')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20"> Continue with Google
        </button>

        <p style="margin-top: 25px;">Don't have an account? <a href="/register">Sign Up</a></p>
    </div>
</body>
</html>
